<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kharchify - Offline</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-6">
    <div class="max-w-md w-full text-center space-y-6 bg-slate-800/80 p-8 rounded-3xl border border-slate-700 shadow-2xl backdrop-blur-xl">
        <div class="w-20 h-20 mx-auto bg-emerald-500/10 text-emerald-400 rounded-3xl flex items-center justify-center ring-1 ring-emerald-500/30">
            <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 5.636a9 9 0 010 12.728m0 0l-2.829-2.829m2.829 2.829L21 21M15.536 8.464a5 5 0 010 7.072m0 0l-2.829-2.829m-4.243 4.243a9 9 0 01-2.828-6.364 9 9 0 012.828-6.364m0 0l2.829 2.829m-2.829-2.829L3 3m6.364 12.728a5 5 0 01-1.414-3.536 5 5 0 011.414-3.536"></path>
            </svg>
        </div>
        
        <div>
            <h1 class="text-2xl font-black text-white tracking-tight">You're Offline</h1>
            <p class="text-slate-400 text-sm mt-2">Please check your internet connection. Kharchify will automatically reconnect as soon as you're back online.</p>
        </div>

        <button onclick="window.location.reload()" class="w-full py-3.5 px-6 rounded-2xl bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-sm shadow-lg shadow-emerald-900/40 transition active:scale-95">
            Retry Connection
        </button>
    </div>
</body>
</html>
