<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 100" fill="none" class="kharchify-icon">
    <defs>
        <!-- Gradients for vibrant modern look -->
        <linearGradient id="kharchify-grad-left" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#047857" />
            <stop offset="100%" stop-color="#059669" />
        </linearGradient>

        <linearGradient id="kharchify-grad-mid" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#059669" />
            <stop offset="100%" stop-color="#10b981" />
        </linearGradient>

        <linearGradient id="kharchify-grad-arrow" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#0d9488" />
            <stop offset="50%" stop-color="#10b981" />
            <stop offset="100%" stop-color="#34d399" />
        </linearGradient>

        <linearGradient id="kharchify-grad-dark" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#065f46" />
            <stop offset="100%" stop-color="#022c22" />
        </linearGradient>

        <filter id="icon-glow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#10b981" flood-opacity="0.25"/>
        </filter>
    </defs>

    <g filter="url(#icon-glow)">
        <!-- 1. Left Parallelogram Bar -->
        <path d="M 12 78 L 32 78 L 50 44 L 30 44 Z" fill="url(#kharchify-grad-left)" />

        <!-- 2. Middle Main Slope Body -->
        <path d="M 36 78 L 56 78 L 84 26 L 64 26 Z" fill="url(#kharchify-grad-mid)" />

        <!-- 3. Bottom Dark Emerald Triangle Facet -->
        <path d="M 60 78 L 88 78 L 74 54 Z" fill="url(#kharchify-grad-dark)" />

        <!-- 4. Top Rising Arrow Head -->
        <path d="M 52 38 L 94 38 L 84 8 Z" fill="url(#kharchify-grad-arrow)" />
        
        <!-- Arrow Body Connection Highlight -->
        <path d="M 48 56 L 68 56 L 82 30 L 62 30 Z" fill="url(#kharchify-grad-arrow)" opacity="0.9" />
    </g>
</svg>
